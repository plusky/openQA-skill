---
name: good
description: >
  Clean schedule: every key: value pair in this text is prose.
vars:
  DESKTOP_MODE: textmode
  +BOOT_HDD_IMAGE: 1
schedule:
  - installation/welcome
  - '{{first_boot}}'
  - console/sshd
  - x11/game.py
conditional_schedule:
  first_boot:
    ARCH:
      x86_64:
        - installation/first_boot
      s390x:
    VERSION:
      +undefined:
        - console/zypper_ref
test_data:
  <<: !include test_data/disks.yaml
  name: not_a_top_level_name
